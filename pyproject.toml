[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supportflow"
version = "0.1.0"
description = "An AI-assisted customer-support ticket triage service."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.5,<2.0",
  "joblib>=1.4,<2.0",
  "openai>=1.0,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
